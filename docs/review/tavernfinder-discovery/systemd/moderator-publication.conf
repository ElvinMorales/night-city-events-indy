# Example drop-in for indy-discovery-report.service. Install only after approval.
[Service]
WorkingDirectory=/opt/indy-discovery/moderator-release
ExecStart=
ExecStart=/usr/bin/node --import tsx /opt/indy-discovery/moderator-release/tools/tavernfinder-discovery/report.ts
ReadWritePaths=/var/lib/indy-discovery/moderation
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
Environment=INDY_MODERATOR_ORIGIN=https://srv1804782.tail1e7b6d.ts.net:10443
EnvironmentFile=-/etc/indy-discovery/publication.env
# Add this directive only after approval and credential provisioning.
# LoadCredential=indy-github-token:/etc/indy-discovery/indy-github-token
