name: One-off Melee runner diagnostic
on:
  workflow_dispatch:
    inputs:
      reviewed_robots_sha256:
        description: SHA-256 of robots.txt reviewed for this user agent and route, if present
        required: false
        type: string
      reviewed_terms_sha256:
        description: SHA-256 of terms reviewed for this retrieval
        required: false
        type: string

permissions:
  contents: read
concurrency:
  group: melee-runner-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.ref_name == 'diagnostic/melee-runner' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify production catalog baseline
        run: echo '6a91d15b830f46cb8d00f72d0e49be507e2ef4b9ab0336e115e42a044a38d43e  src/data/events.json' | sha256sum --check | tee catalog-before.txt
      - name: Check DNS, HTTPS and source restrictions
        id: preflight
        env:
          REVIEWED_ROBOTS_SHA256: ${{ inputs.reviewed_robots_sha256 }}
          REVIEWED_TERMS_SHA256: ${{ inputs.reviewed_terms_sha256 }}
        run: python3 tools/melee-discovery/runner-preflight.py melee-artifacts
      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.pilot_eligible == 'true'
        with:
          node-version: 22
      - if: steps.preflight.outputs.pilot_eligible == 'true'
        run: npm ci
      - name: Run the bounded Books & Brews pilot
        if: steps.preflight.outputs.pilot_eligible == 'true'
        env:
          MELEE_RETRIEVAL_ENABLED: 'true'
        run: |
          mapping=docs/sources/melee-organizations.json
          backup=$(mktemp)
          cp "$mapping" "$backup"
          trap 'cp "$backup" "$mapping"; rm -f "$backup"' EXIT
          node --input-type=module - "$mapping" <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = process.argv[2];
          const sources = JSON.parse(readFileSync(path, 'utf8'));
          const books = sources.find(source => source.organizationId === '19843');
          if (!books || !books.locationIds.includes('18573')) throw new Error('Books & Brews mapping missing');
          writeFileSync(path, JSON.stringify([{ ...books, enabled: true, locationIds: ['18573'] }]));
          JS
          node --import tsx tools/melee-discovery/refresh.ts --pilot melee-artifacts
      - name: Verify production catalog after diagnostic
        if: always()
        run: |
          mkdir -p melee-artifacts
          cp catalog-before.txt melee-artifacts/catalog-before.txt
          echo '6a91d15b830f46cb8d00f72d0e49be507e2ef4b9ab0336e115e42a044a38d43e  src/data/events.json' | sha256sum --check | tee melee-artifacts/catalog-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: melee-runner-diagnostic
          path: melee-artifacts/
          if-no-files-found: error
          retention-days: 7
