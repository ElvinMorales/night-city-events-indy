name: Publish GitHub Pages

# Publishing is an explicit action, independent of checks.yml and ordinary pushes.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA of the verified release commit
        required: true
        type: string

      moderator_release:
        description: Release authorized from the Indy moderator dashboard
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.moderator_release || vars.INDY_MODERATOR_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify release revision
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$DEFAULT_BRANCH" = main
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$RELEASE_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: inputs.moderator_release
        run: node --import tsx tools/tavernfinder-discovery/check-transition.ts
      # Validate the exact revision being published, independently of other workflows.
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm the approved revision is still on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      # Pages must already have been enabled by an authorized maintainer.
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
